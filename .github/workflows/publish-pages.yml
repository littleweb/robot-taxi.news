name: RoboTaxi daily static publication
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish local Codex research or bootstrap the reviewed archive
        type: choice
        options: [codex, bootstrap]
        default: codex
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: robotaxi-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: bootstrap-only
          POSTGRES_DB: robotaxi
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:bootstrap-only@127.0.0.1:5432/robotaxi
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      IMG_PROXY_SIGN_SECRET: ${{ secrets.IMG_PROXY_SIGN_SECRET }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SITE_URL: http://127.0.0.1:3100
      WEB_PORT: '3100'
      COLLECT_ENABLED: 'false'
      MODEL_CALLS_ENABLED: 'false'
      FEISHU_CONTENT_PUSH_ENABLED: 'false'
      FEISHU_INTERNAL_ENABLED: 'false'
      INDEXNOW_SUBMIT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Validate configuration and create ephemeral bootstrap secrets
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';import {randomBytes} from 'node:crypto';
          for(const key of ['SESSION_SECRET','IMG_PROXY_SIGN_SECRET','ADMIN_PASSWORD'])if(!process.env[key]){const value=randomBytes(32).toString('hex');console.log('::add-mask::'+value);appendFileSync(process.env.GITHUB_ENV,key+'='+value+'\n');}
          JS
      - run: npm run db:migrate && node scripts/seed.ts
      - name: Bootstrap manually verified sources
        run: node modules/robotaxi/import-reviewed.ts site/reviewed-bootstrap.json
      - name: Import local Codex editions without model API calls
        if: inputs.mode == 'codex'
        run: |
          for edition in site/editions/*.json; do
            test -f "$edition" || { echo "No local Codex editions found"; exit 1; }
            node modules/robotaxi/import-reviewed.ts "$edition" --codex
          done
      - run: npm run typecheck && npm run build -w @aihot/web
      - name: Start original API and web servers
        run: |
          node apps/api/src/main.ts > /tmp/api.log 2>&1 &
          (cd apps/web && node server.ts) > /tmp/web.log 2>&1 &
          node --input-type=module <<'JS'
          for(let n=0;n<60;n++){try{if((await fetch('http://127.0.0.1:3100/api/health')).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}throw new Error('Site did not start');
          JS
      - run: node scripts/smoke.ts --base http://127.0.0.1:3100
      - run: npm run export:static -- --base http://127.0.0.1:3100 --prefix "${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/static
      - uses: actions/deploy-pages@v4
        id: deployment
